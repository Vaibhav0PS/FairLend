name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - name: Run tests
        run: pytest -q

  infra-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDK library
        run: pip install aws-cdk-lib==2.276.0 constructs==10.8.1
      - name: Synthesize CDK stacks
        working-directory: infra
        run: npx --yes aws-cdk@2.1148.1 synth --strict -q
